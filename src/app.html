<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0f1115">
<meta name="robots" content="noindex,nofollow">
<title>鍛冶ナビ</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/*#include app.css*/
</style>
</head>
<body>
<main>
  <div class="top">
    <select id="item" aria-label="商材"></select>
    <div class="stats">
      <button class="stat" id="stTemp" aria-label="温度を直す"><small>温度<span class="u">℃</span></small><span class="sv"><b id="temp">1000</b></span><span class="k" id="kind"></span></button>
      <span class="hsslot" id="hsSlot"><button class="hsb" id="hsB" aria-label="必殺(ヘパイトスの炎)の状態"><small>必殺</small><b id="hsBt">なし</b><span id="hsBn">たまったら押す</span></button></span>
      <button class="stat" id="stFocus" aria-label="今の集中力を直す"><small>集中力</small><span class="sv"><b id="focus">242</b></span></button>
    </div>
    <button class="gear" id="reset" aria-label="最初からやり直す">最初から</button><button class="gear" id="gearB" aria-label="設定を開く">設定</button>
  </div>
  <div class="hsrow" id="hsRow" hidden></div>
  <div class="board" id="board"></div>
  <div class="msg" id="msg"></div>
  <div class="tres" id="tres" hidden>
    <div class="tres-h"><b>最強(テスト中)の記録</b> <span id="tresN">0手</span><button type="button" id="tresPick">保存先: <span id="tresDir">未設定</span></button></div>
    <div class="tres-q">この局の結果は?</div>
    <div class="tres-b"><button type="button" data-r="大成功" class="r-great">大成功</button><button type="button" data-r="成功" class="r-ok">成功</button><button type="button" data-r="失敗" class="r-fail">失敗</button></div>
  </div>
  <!--SELF-PANEL-->
</main>

<div class="foot fold"><div class="in">
  <div class="rec" id="rec"></div>
  <div class="alts" id="alts"></div>
  <div class="relit" id="relit" hidden></div>
  <div class="critrow" id="critRow" hidden><button class="critb" id="critB" hidden aria-label="直前に叩いたマスが会心だった">今の会心!</button><div class="critp" id="critP" hidden></div></div>
  <div class="dlab" id="dLab" hidden></div>
  <div class="vbs" id="dVals" hidden></div>
  <div class="litb" id="dLit" hidden></div>
  <div class="acts"><button class="undo" id="undo" aria-label="1手戻す">戻す</button><button class="undo" id="dCancel" hidden>やめる</button><button class="main" id="go">計算中…</button><button class="chain" id="chainB" hidden></button><button type="button" class="critsw" id="critSw" role="switch" aria-checked="false" hidden><i></i>会心が出た</button><button class="main" id="dOk" hidden>決定</button></div>
</div></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<div class="modal" id="reelM"><div class="sheet" onclick="event.stopPropagation()">
  <div class="shhead"><h2 id="reelT">叩いた後の値</h2><button type="button" class="intog" id="inTog" hidden aria-label="入れ方を切り替える(リール・ボタン)"><span data-v="reel">リール</span> ⇄ <span data-v="btn">ボタン</span></button></div>
  <div class="bigh" id="reelBig" hidden></div>
  <div class="reels" id="reels"></div>
  <div class="row2"><button id="reelCancel">やめる</button><button class="main" id="reelOk">決定</button></div>
</div></div>

<div class="modal" id="setM"><div class="sheet setsh" onclick="event.stopPropagation()">
  <div class="sethd"><h2>設定</h2><button id="setClose">閉じる</button></div>
  <div class="setg">
    <div class="setr"><button class="stat vbtn" id="vB" aria-label="声のオン・オフ"><small>声</small><b id="vBt">オン</b></button><label class="vrate">速さ <select id="vRate"><option value="0.9">ゆっくり</option><option value="1">ややゆっくり</option><option value="1.15">ふつう</option><option value="1.35">はやい</option><option value="1.6">とてもはやい</option><option value="1.9">さらにはやい</option></select></label></div>
    <div class="setr"><label class="vrate">計算の強さ <select id="power"><option value="normal">ふつう</option><option value="strong">強(スマホ向け)</option><option value="max">最強(PC向け)</option><option value="maxTest" id="powTest" hidden>最強(テスト中)</option><option value="maxGpu" id="powGpu" hidden>最強(GPU)</option></select></label></div>
    <div class="setr"><span class="sl">文字</span><div class="seg seg3" id="sizeSeg"><button type="button" data-v="s">小</button><button type="button" data-v="m">中</button><button type="button" data-v="l">大</button></div></div>
    <div class="setr"><span class="sl">入れ方</span><div class="seg" id="inSeg"><button type="button" data-v="btn">ボタン</button><button type="button" data-v="reel">リール</button></div></div>
    <div class="setr"><button class="cfgb startf" id="cfgB2" aria-label="最初の集中力を変える">最初の集中力 <b id="cfgB2v">245</b></button><button class="techb" id="techB" aria-label="使う技を選ぶ"><small>使う技</small><b id="techBv">15/15</b></button></div>
    <div class="setr" id="pipRow" hidden><button id="pipB" hidden aria-label="いつも最前面に出る小窓を開く">小窓を開く</button></div>
    <div class="setr"><button type="button" id="retLogB">戻りの記録をコピー</button></div>
  </div>
  <div class="note">
    マス・温度・集中力の数字は、押すと直せる。<br>
    ゲームに「ひっさつ」が出たら、上の「必殺」を押す。<br>
    声: VOICEVOX:ずんだもん
    <br><a class="gh" href="https://github.com/kakkun15/kaji-navi" target="_blank" rel="noopener">GitHub(説明・ソース)</a>
  </div>
</div></div>

<div class="modal" id="cfgM"><div class="sheet" onclick="event.stopPropagation()">
  <h2>最初の集中力</h2>
  <div class="num"><input id="cfF" type="number" inputmode="numeric" min="1" max="999" aria-label="最初の集中力"></div>
  <div class="hint" style="margin:-4px 2px 12px">打ち始める前にゲームに出ている集中力。ハンマーは光の鍛冶ハンマー★3 の前提。</div>
  <h2 style="margin-top:6px">使う技</h2>
  <div class="hint" style="margin:0 2px 8px">覚えていない技は押して外す。Lv は覚えるレベル。</div>
  <div class="techs" id="cfT"></div>
  <div class="seg" id="cfIn" hidden><button type="button" data-v="reel">リール</button><button type="button" data-v="btn">ボタン(テスト)</button></div>
  <div class="row2"><button id="cfgCancel">やめる</button><button class="main" id="cfgOk">決める</button></div>
</div></div>

<div class="modal" id="numM"><div class="sheet" onclick="event.stopPropagation()">
  <h2 id="numT"></h2>
  <div class="num"><input id="numI" type="number" inputmode="numeric"></div>
  <div class="row2"><button id="numCancel">やめる</button><button class="main" id="numOk">決める</button></div>
</div></div>

<div class="modal" id="allM"><div class="sheet setsh" onclick="event.stopPropagation()">
  <div class="sethd"><h2>全部の手</h2><button id="allClose">閉じる</button></div>
  <div class="allg" id="allL"></div>
</div></div>

<script src="core.js"></script>
<script src="game.js"></script>
<script src="value.js"></script>
<script src="pool.js"></script>
<script src="gpumax.js"></script>
<script src="rule0.js"></script>
<script src="weights.js"></script>
<script src="voice.js"></script>

</body>
</html>
